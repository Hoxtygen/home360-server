server:
  port: 8080

allowed:
  origins: http://localhost:3000

springdoc:
  api-docs:
    path: /v3/api/docs
  swagger-ui:
    path: /swagger-ui.html

websocket:
  broker:
    relayHost: ${SPRING_WEBSOCKET_BROKER_RELAY_HOST:localhost}
    brokerPort: ${SPRING_WEBSOCKET_BROKER_RELAY_PORT:61613}
    clientLogin: ${SPRING_WEBSOCKET_BROKER_CLIENT_LOGIN:guest}
    clientPasscode: ${SPRING_WEBSOCKET_BROKER_CLIENT_PASSCODE:guest}


cors:
  allowed-origins: ${SPRING_ALLOWED_ORIGINS}

spring:
  application:
    name: Home360
  config:
    activate:
      on-profile: dev
  jackson:
    time-zone: UTC
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}

  cache:
    type: redis
    host: redis
    port: 6379
    redis:
      time-to-live: 60000

  mail:
    host: ${SPRING_EMAIL_HOST}
    port: ${SPRING_EMAIL_PORT}
    username: ${SPRING_EMAIL_USERNAME}
    password: ${SPRING_EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    mongodb:
      authentication-database: admin
      database: home360dev
      auto-index-creation: true
      uri: mongodb://localhost:27017/home360dev
      embedded:
        enabled: false

  output:
    ansi:
      enabled: DETECT
  datasource:
    url: jdbc:postgresql://localhost:5432/home360_dev
    username: hoxtygen
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
      database: postgresql
    show-sql: true
  main:
    web-application-type: servlet

application:
  security:
    jwt:
      secret-key: ${SPRING_SECRET_KEY}
      jwtTokenExpirationMs: 1800000 # 30 minutes
#      jwtTokenExpirationMs: 300000 # 5 minutes

  frontend:
    url: ${SPRING_FRONTEND_URL}
    password-reset-request:
      url: ${SPRING_PASSWORD_RESET_REQUEST}
    reset-password:
      url: ${SPRING_RESET_PASSWORD}
    verify-email:
      url: ${SPRING_VERIFY_EMAIL}
    user-listings-url:
      url: ${SPRING_USER_LISTINGS_URL}

  mail:
    mailSenderName: ${SPRING_EMAIL_SENDER_NAME}
    mailSenderAddress: ${SPRING_EMAIL_SENDER_ADDRESS}


logging:
  file.name: logs/application-debug.log
  pattern:
    console: "%d{dd-MM-yyyy HH:mm:ss} - %msg%n"
    file: "%d{dd-MM-yyyy HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: ERROR
    org.springframework.web: ERROR
    com.codeplanks: DEBUG
    org.hibernate: ERROR
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.orm: DEBUG
    org.springframework.cache: TRACE

management:
  info:
    git:
      mode: full
    env:
      enabled: true
    java:
      enabled: true
  app:
    name: Home360
    description: "Home360 Application"
    version: 1.0.0
  env:
    enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
    db:
      enabled: true
    redis:
      enabled: true
    metrics:
      enabled: true
      prometheus:
        enabled: true
    info:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Application for real estate agents
    version: '@project.version@'
    spring-boot-version: '@project.parent.version@'

sentry:
  dsn: ${SPRING_SENTRY_DSN_URL}
  # Add data like request headers and IP for users,
  # see https://docs.sentry.io/platforms/java/guides/spring-boot/data-management/data-collected/ for more info
  send-default-pii: true
  # Set traces-sample-rate to 1.0 to capture 100% of transactions for tracing.
  # We recommend adjusting this value in production.
  traces-sample-rate: 1.0