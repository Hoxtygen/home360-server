server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api/docs
  swagger-ui:
    path: /swagger-ui.html

cors:
  allowed-origins: ${SPRING_ALLOWED_ORIGINS}

spring:
  application:
    name: Home360
  config:
    activate:
      on-profile: docker

  cache:
    type: redis
    host: redis
    port: 6379
    redis:
      time-to-live: 60000

  mail:
    host: ${SPRING_EMAIL_HOST}
    port: ${SPRING_EMAIL_PORT}
    username: ${SPRING_EMAIL_USERNAME}
    password: ${SPRING_EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    mongodb:
      authentication-database: admin
      database: home360dev
      auto-index-creation: true
      uri: mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongo:27017/home360dev?authSource=admin
      embedded:
        enabled: false

    redis:
      host: redis
      port: 6379

  output:
    ansi:
      enabled: DETECT
  datasource:
    url: jdbc:postgresql://localhost:5432/home360_dev
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      database: postgresql
    show-sql: true
  main:
    web-application-type: servlet

application:
  security:
    jwt:
      secret-key: ${SPRING_SECRET_KEY}
      jwtTokenExpirationMs: ${SPRING_TOKEN_EXPIRATION_MILLISECONDS} # 30 minutes
  #      jwtTokenExpirationMs: 300000 # 5 minutes

  frontend:
    url: ${SPRING_FRONTEND_URL}
    password-reset-request:
      url:  ${SPRING_PASSWORD_RESET_REQUEST}
    reset-password:
      url: ${SPRING_RESET_PASSWORD}
    verify-email:
      url:  ${SPRING_VERIFY_EMAIL}
    user-listings-url:
      url: ${SPRING_USER_LISTINGS_URL}

  mail:
    mailSenderName: ${SPRING_EMAIL_SENDER_NAME}
    mailSenderAddress: ${SPRING_EMAIL_SENDER_ADDRESS}

logging:
  file.name: logs/application-debug.log
  pattern:
    console: "%d{dd-MM-yyyy HH:mm:ss} - %msg%n"
    file: "%d{dd-MM-yyyy HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: ERROR
    org.springframework.web: ERROR
    com.codeplanks: DEBUG
    org.hibernate: ERROR
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.orm: DEBUG
    org.springframework.cache: DEBUG

management:
  info:
    git:
      mode: full
    env:
      enabled: true
    java:
      enabled: true
  app:
    name: Home360
    description: "Home360 Application"
    version: 1.0.0
  env:
    enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
    db:
      enabled: true
    redis:
      enabled: true
    metrics:
      enabled: true
      prometheus:
        enabled: true
    info:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Application for real estate agents
    version: '@project.version@'
    spring-boot-version: '@project.parent.version@'

    sentry:
      dsn: ${SPRING_SENTRY_DSN_URL}
      # Add data like request headers and IP for users,
      # see https://docs.sentry.io/platforms/java/guides/spring-boot/data-management/data-collected/ for more info
      send-default-pii: true
      # Set traces-sample-rate to 1.0 to capture 100% of transactions for tracing.
      # We recommend adjusting this value in production.
      traces-sample-rate: 1.0